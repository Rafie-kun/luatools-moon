name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl jq luajit nodejs python3 tar unzip zip p7zip-full

      # The suite checks Lumen's RPC allowlist against boot.lua, which it finds
      # at ../lumen relative to the workspace. Clone it as that sibling; the
      # checkout action cannot write outside the workspace.
      - name: Check out Lumen for the cross-repo checks
        run: |
          git clone --depth 1 https://github.com/Rafie-kun/lumen \
            "$(dirname "$GITHUB_WORKSPACE")/lumen"

      - name: Test
        run: scripts/test.sh
